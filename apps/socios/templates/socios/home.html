<h1>Listado de socios</h1>

<table>
  <thead>
    <tr>
      <th>Nombre</th>
      <th>Apellidos</th>
      <th>DNI</th>
      <th>Email</th>
      <th>Estado</th>
    </tr>
  </thead>
  <tbody>
  {% for s in socios %}
    <tr>
      <td>{{ s.nombre }}</td>
      <td>{{ s.apellidos }}</td>
      <td>{{ s.dni }}</td>
      <td>{{ s.email }}</td>
      <td>{% if s.estado %}Activo{% else %}Baja{% endif %}</td>
    </tr>
  {% empty %}
    <tr>
      <td colspan="5">No hay socios</td>
    </tr>
  {% endfor %}
  </tbody>
</table>
